<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TrustVault - Upload</title></head>
<body>
  <h1>Upload a document</h1>
  <p><a href="{{ url_for('documents') }}">Back</a></p>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <p><input type="file" name="file" required></p>
    <p><label>Category <input name="category" maxlength="50"></label></p>
    <button type="submit">Upload</button>
  </form>
  <p>Allowed: pdf, png, jpg, txt (max 5 MB)</p>
</body>
</html>
