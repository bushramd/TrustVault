<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><meta charset="utf-8"><title>TrustVault - Share</title></head>
<body>
  <h1>Share: {{ doc.name }}</h1>
  <p><a href="{{ url_for('documents') }}">Back</a></p>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username <input name="username" required></label>
    <select name="permission">
      <option value="read">read</option>
      <option value="edit">edit</option>
    </select>
    <button type="submit">Grant access</button>
  </form>
  <h2>Who has access</h2>
  <table border="1" cellpadding="4">
    <tr><th>User</th><th>Permission</th><th></th></tr>
    {% for gr in grants %}
    <tr>
      <td>{{ gr.username }}</td><td>{{ gr.permission }}</td>
      <td>
        <form method="post" action="{{ url_for('revoke', doc_id=doc.id, grant_id=gr.id) }}">
          <button type="submit">Revoke</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
