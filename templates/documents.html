<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><meta charset="utf-8"><title>TrustVault - Documents</title></head>
<body>
  <h1>Documents</h1>
  <p><a href="{{ url_for('dashboard') }}">Back</a>
  {% if user.role == 'owner' %} | <a href="{{ url_for('upload') }}">Upload</a>{% endif %}</p>
  <table border="1" cellpadding="4">
    <tr><th>Name</th><th>Owner</th><th>Category</th><th>Uploaded</th><th>Actions</th></tr>
    {% for d in docs %}
    <tr>
      <td>{{ d.name }}</td><td>{{ d.owner }}</td><td>{{ d.category or '-' }}</td><td>{{ d.created_at }}</td>
      <td>
        <a href="{{ url_for('download', doc_id=d.id) }}">Download</a>
        {% if d.owner_id == user.id %}
        | <a href="{{ url_for('share', doc_id=d.id) }}">Share</a>
        <form method="post" action="{{ url_for('delete', doc_id=d.id) }}" style="display:inline">
          <button type="submit">Delete</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
