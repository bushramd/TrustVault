<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TrustVault - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>TrustVault</h1>
  <p>Logged in as <strong>{{ user.username }}</strong> (role: {{ user.role }})</p>
  <p><a href="{{ url_for('documents') }}">My documents</a></p>
  {% if user.role == 'admin' %}<p><a href="{{ url_for('admin') }}">Admin: activity log</a></p>{% endif %}
  {% if user.role == 'admin' %}
<p><a href="{{ url_for('admin') }}">Admin: activity log</a></p>
<p><a href="{{ url_for('admin_permissions') }}">Admin: permission changes</a></p>
{% endif %}
  <form method="post" action="{{ url_for('logout') }}">
    <button type="submit">Log out</button>
  </form>
</body>
</html>
