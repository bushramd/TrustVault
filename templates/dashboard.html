<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TrustVault - Dashboard</title>
</head>
<body>
  <h1>TrustVault</h1>
  <p>Logged in as <strong>{{ user.username }}</strong> (role: {{ user.role }})</p>
  {% if user.role == 'admin' %}<p><a href="{{ url_for('admin') }}">Admin: activity log</a></p>{% endif %}
  <form method="post" action="{{ url_for('logout') }}">
    <button type="submit">Log out</button>
  </form>
</body>
</html>
